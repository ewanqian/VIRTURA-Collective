<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIRTURA Custom Merch</title>
  <meta name="description" content="VIRTURA 定制周边编辑器：同时查看正反面、22cm/5cm 固定规格、导出 PNG 与分享方案。">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="VIRTURA Collective">
      <img src="./assets/virtura-logo.svg" alt="VIRTURA">
    </a>
    <div class="titleblock">
      <span>VIRTURA / CUSTOM MERCH</span>
      <small>TEE EDITOR · FINAL</small>
    </div>
    <button class="ghost compact" id="screenshotModeBtn" type="button">截图模式</button>
  </header>

  <main class="layout">
    <section class="stageWrap">
      <div class="stageTop">
        <div class="viewSwitch" role="tablist" aria-label="编辑面板切换">
          <button class="tab active" data-view="front" type="button">EDIT FRONT 正面</button>
          <button class="tab" data-view="back" type="button">EDIT BACK 背面</button>
        </div>
        <div class="stageMeta"><span>BLACK TEE</span><span>SHOW FRONT + BACK</span></div>
      </div>

      <div class="stage" id="stage">
        <div class="dualStage">
          <div class="teePane activePane" data-pane="front">
            <svg id="editorSvgFront" viewBox="0 0 600 700" role="img" aria-label="T恤正面定制预览"></svg>
          </div>
          <div class="teePane" data-pane="back">
            <svg id="editorSvgBack" viewBox="0 0 600 700" role="img" aria-label="T恤背面定制预览"></svg>
          </div>
        </div>
        <div class="hint" id="dragHint">同时显示正反面 · 当前只编辑高亮的一面 · 拖动 Logo 调整位置</div>
      </div>

      <div class="mobileActions">
        <button class="primary" id="confirmBtnMobile" type="button">确认定制</button>
        <button class="ghost" id="exportCombinedMobile" type="button">导出正反面 PNG</button>
      </div>
    </section>

    <aside class="panel" id="panel">
      <section class="panelSection">
        <div class="sectionLabel">01 / LOGO</div>
        <button class="primary full" id="addLogoBtn" type="button">+ 添加 VIRTURA LOGO</button>
        <div class="presetGrid twoCol">
          <button class="preset" data-size="22" type="button"><strong>22 CM</strong><span>大 Logo / 主图</span></button>
          <button class="preset" data-size="5" type="button"><strong>5 CM</strong><span>小 Logo / 辅图</span></button>
        </div>
      </section>

      <section class="panelSection">
        <div class="sectionLabel">02 / QUICK PRESETS</div>
        <div class="presetList">
          <button class="ghost full textLeft" data-quick="bigCenter" type="button">22 CM · 胸前居中 · 0°</button>
          <button class="ghost full textLeft" data-quick="smallChest" type="button">5 CM · 胸前小标 · 0°</button>
          <button class="ghost full textLeft" data-quick="angledChest" type="button">5 CM · 斜向胸标 · 38°</button>
          <button class="ghost full textLeft" data-quick="sleeve" type="button">5 CM · 袖口 · 12°</button>
          <button class="ghost full textLeft" data-quick="lower" type="button">5 CM · 下摆角 · 38°</button>
        </div>
      </section>

      <section class="panelSection">
        <div class="sectionLabel">03 / POSITION</div>
        <div class="positionGrid">
          <button data-place="centerChest" type="button">胸前居中</button>
          <button data-place="leftChest" type="button">左胸</button>
          <button data-place="rightChest" type="button">右胸</button>
          <button data-place="leftSleeve" type="button">左袖</button>
          <button data-place="rightSleeve" type="button">右袖</button>
          <button data-place="backLower" type="button">背面下摆</button>
        </div>
      </section>

      <section class="panelSection controls">
        <div class="sectionLabel">04 / SELECTED ITEM</div>
        <div class="statusLine">当前编辑面：<strong id="currentSideOut">正面 FRONT</strong></div>
        <div class="statusLine">当前规格：<strong id="sizeOut">22 CM</strong></div>
        <div class="rotateQuickGrid">
          <button class="ghost" data-rotate="0" type="button">0°</button>
          <button class="ghost" data-rotate="12" type="button">12°</button>
          <button class="ghost" data-rotate="38" type="button">38°</button>
          <button class="ghost" data-rotate="45" type="button">45°</button>
        </div>
        <div class="inlineBtns">
          <button class="ghost" id="duplicateBtn" type="button">复制</button>
          <button class="ghost danger" id="deleteBtn" type="button">删除</button>
        </div>
      </section>

      <section class="panelSection">
        <div class="sectionLabel">05 / OUTPUT</div>
        <div class="outputBtns">
          <button class="ghost full" id="exportCurrentBtn" type="button">导出当前编辑面 PNG</button>
          <button class="ghost full" id="exportCombinedBtn" type="button">导出正反面 PNG</button>
          <button class="ghost full" id="copyLinkBtn" type="button">复制方案链接</button>
          <button class="primary full" id="confirmBtn" type="button">确认定制</button>
        </div>
        <p class="note">固定规格仅有 22 CM 与 5 CM。静态网页，不上传图片与数据。方案仅保存在你的浏览器或链接中。</p>
      </section>
    </aside>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialogCard">
      <div class="dialogHead"><span>VIRTURA CUSTOM MERCH</span><button value="cancel" aria-label="关闭">×</button></div>
      <h2>定制方案已确认</h2>
      <div id="summary" class="summary"></div>
      <div class="dialogActions">
        <button class="ghost" value="cancel">继续编辑</button>
        <button class="primary" id="dialogExportBtn" value="cancel" type="button">下载正反面图</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
