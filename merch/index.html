<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIRTURA Custom Merch</title>
  <meta name="description" content="VIRTURA 定制周边编辑器：正反面排版、22cm/5cm Logo 规格、导出 PNG 与分享方案。">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="VIRTURA Collective">
      <img src="./assets/virtura-logo.svg" alt="VIRTURA">
    </a>
    <div class="titleblock">
      <span>VIRTURA / CUSTOM MERCH</span>
      <small>TEE EDITOR · TEST 001</small>
    </div>
    <button class="ghost compact" id="screenshotModeBtn" type="button">截图模式</button>
  </header>

  <main class="layout">
    <section class="stageWrap">
      <div class="stageTop">
        <div class="viewSwitch" role="tablist" aria-label="衣服正反面">
          <button class="tab active" data-view="front" type="button">FRONT 正面</button>
          <button class="tab" data-view="back" type="button">BACK 背面</button>
        </div>
        <div class="stageMeta"><span>BLACK TEE</span><span>BODY WIDTH ≈ 60 CM</span></div>
      </div>

      <div class="stage" id="stage">
        <svg id="editorSvg" viewBox="0 0 600 700" role="img" aria-label="T恤定制预览"></svg>
        <div class="hint" id="dragHint">拖动 Logo 调整位置 · 点击 Logo 选中</div>
      </div>

      <div class="mobileActions">
        <button class="primary" id="confirmBtnMobile" type="button">确认定制</button>
        <button class="ghost" id="exportCombinedMobile" type="button">导出正反面 PNG</button>
      </div>
    </section>

    <aside class="panel" id="panel">
      <section class="panelSection">
        <div class="sectionLabel">01 / LOGO</div>
        <button class="primary full" id="addLogoBtn" type="button">+ 添加 VIRTURA LOGO</button>
        <div class="presetGrid">
          <button class="preset" data-size="22" type="button"><strong>22 CM</strong><span>大 Logo / 主图</span></button>
          <button class="preset" data-size="5" type="button"><strong>5 CM</strong><span>小 Logo / 胸口</span></button>
        </div>
      </section>

      <section class="panelSection">
        <div class="sectionLabel">02 / POSITION</div>
        <div class="positionGrid">
          <button data-place="centerChest" type="button">胸前居中</button>
          <button data-place="leftChest" type="button">左胸</button>
          <button data-place="rightChest" type="button">右胸</button>
          <button data-place="leftSleeve" type="button">左袖</button>
          <button data-place="rightSleeve" type="button">右袖</button>
          <button data-place="lower" type="button">下摆偏右</button>
        </div>
      </section>

      <section class="panelSection controls">
        <div class="sectionLabel">03 / SELECTED ITEM</div>
        <label>
          <span>宽度 <output id="sizeOut">22.0 cm</output></span>
          <input id="sizeRange" type="range" min="3" max="30" value="22" step="0.5">
        </label>
        <label>
          <span>旋转 <output id="rotationOut">0°</output></span>
          <input id="rotationRange" type="range" min="-35" max="35" value="0" step="1">
        </label>
        <div class="inlineBtns">
          <button class="ghost" id="duplicateBtn" type="button">复制</button>
          <button class="ghost danger" id="deleteBtn" type="button">删除</button>
        </div>
      </section>

      <section class="panelSection">
        <div class="sectionLabel">04 / OUTPUT</div>
        <div class="outputBtns">
          <button class="ghost full" id="exportCurrentBtn" type="button">导出当前面 PNG</button>
          <button class="ghost full" id="exportCombinedBtn" type="button">导出正反面 PNG</button>
          <button class="ghost full" id="copyLinkBtn" type="button">复制方案链接</button>
          <button class="primary full" id="confirmBtn" type="button">确认定制</button>
        </div>
        <p class="note">静态网页，不上传图片与数据。方案仅保存在你的浏览器或链接中。</p>
      </section>
    </aside>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialogCard">
      <div class="dialogHead"><span>VIRTURA CUSTOM MERCH</span><button value="cancel" aria-label="关闭">×</button></div>
      <h2>定制方案已确认</h2>
      <div id="summary" class="summary"></div>
      <div class="dialogActions">
        <button class="ghost" value="cancel">继续编辑</button>
        <button class="primary" id="dialogExportBtn" value="cancel" type="button">下载正反面图</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
